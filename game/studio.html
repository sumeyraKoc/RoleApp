<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>roleApp Studio</title>
  <script>if (!new URLSearchParams(location.search).has("scene")) location.replace("./");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f0c17; }
    body { display: grid; place-items: center; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; }
    body.dub-levels-backdrop {
      background-color: #171020;

      background-position: center;

    }

      background-color: #171020;

    .dialogue-panel {
      box-sizing: border-box;
      width: 760px;
      height: 230px;
      padding: 16px 18px;
      border: 2px solid #ffd166;
      border-radius: 10px;
      background: rgba(33, 24, 47, 0.98);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .dialogue-header, .dialogue-form { display: flex; align-items: center; gap: 10px; }
    .dialogue-header { justify-content: space-between; margin-bottom: 9px; }
    .dialogue-header strong { color: #ffd166; font: 16px "Arial Black", Arial, sans-serif; }
    .dialogue-header span { margin-left: 9px; color: #a99dbd; font-size: 12px; }
    .dialogue-close { border: 0; background: transparent; color: #a99dbd; cursor: pointer; }
    .dialogue-messages {
      height: 105px;
      padding-right: 6px;
      overflow-y: auto;

    }
    .dialogue-scrollable {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 32px;
      gap: 8px;
      height: 105px;

    .dialogue-scrollable .dialogue-messages {
      height: 100%;
      scrollbar-width: none;
    }
    .dialogue-scrollable .dialogue-messages::-webkit-scrollbar { display: none; }
    .dialogue-scroll-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .dialogue-scroll-button {
      box-sizing: border-box;
      width: 28px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      touch-action: none;
    }
    .dialogue-scroll-button::before {
      content: "";
      display: block;
      width: 0;
      height: 0;
      margin: auto;
      border-right: 12px solid transparent;
      border-left: 12px solid transparent;
      filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.25));
    }
    .dialogue-scroll-button.up::before { border-bottom: 17px solid #5d4c72; }
    .dialogue-scroll-button.down::before { border-top: 17px solid #5d4c72; }
    .dialogue-scroll-button:hover::before { border-bottom-color: #7b6795; border-top-color: #7b6795; }
    .dialogue-scroll-button:active::before { border-bottom-color: #ffd166; border-top-color: #ffd166; }
    .dialogue-scroll-track {
      width: 25px;
      height: 3px;
      border-radius: 2px;
      background: #5d4c72;
    }
    .dialogue-system { margin: 26px 0 0; text-align: center; color: #a99dbd; }
    .dialogue-message { display: grid; grid-template-columns: 92px 1fr; gap: 10px; margin: 0 0 9px; }
    .dialogue-message strong { color: #ffd166; font-size: 12px; }
    .dialogue-message span { color: #fff; font-size: 15px; line-height: 1.3; }
    .dialogue-message.user strong { color: #78dce8; }
    .dialogue-message.feedback span { color: #ffd166; }
    .dialogue-message.reward span { color: #8ee89b; }
    .dialogue-message.error span { color: #ff8e8e; }
    .dialogue-status { height: 18px; color: #a99dbd; font-size: 12px; }
    .dialogue-form input {
      flex: 1;
      box-sizing: border-box;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #5d4c72;
      border-radius: 6px;
      outline: 0;
      background: #171020;
      color: #fff;
      font-size: 15px;
    }
    .dialogue-form input:focus { border-color: #ffd166; }
    .dialogue-form button {
      height: 38px;
      min-width: 82px;
      border: 0;
      border-radius: 6px;
      background: #ffd166;
      color: #21182f;
      font-weight: 800;
      cursor: pointer;
    }
    .dialogue-form button:disabled { cursor: wait; opacity: 0.65; }
    .dialogue-form button.dialogue-mic {

      background: #3a2f52;
      color: #fff2d9;

    .vocab-panel { border-color: #8fd3a5; }

    .vocab-panel .dialogue-form input:focus { border-color: #8fd3a5; }
    .vocab-panel .dialogue-form button { background: #8fd3a5; }

      display: flex;
      flex-direction: column;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 14px 20px 6px;

    .dub-wood-btn--back:hover { transform: translateY(-50%) translateY(-2px); }
    .dub-wood-banner { padding: 12px 34px; font-size: 17px; pointer-events: none; }
    .dub-help { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); }

      height: 30px;
      padding: 0;
      border-radius: 50%;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dub-journal-icon { position: absolute; right: 56px; top: 50%; transform: translateY(-50%); font-size: 16px; }
    .dub-help-tooltip {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 230px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #d9ad63;
      background: rgba(20, 13, 6, 0.97);
      color: #f1e6d0;
      font: 400 12px Arial, sans-serif;
      line-height: 1.4;
      text-align: left;
      text-transform: none;
      letter-spacing: normal;
      text-shadow: none;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.55);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
      pointer-events: none;
      z-index: 3;
    }
    .dub-help-tooltip strong { display: block; margin-bottom: 4px; color: #ffd166; font-size: 13px; }
    .dub-help:hover .dub-help-tooltip,
    .dub-help.open .dub-help-tooltip {

    }
    .dub-levels-status { text-align: center; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85); }
    .dub-levels-body {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dub-levels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 28px;
      padding: 12px 20px 20px;
      width: 100%;
    }
    .dub-note-card {
      position: relative;
      box-sizing: border-box;
      min-height: 230px;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: center;
      transform-origin: center;
      filter:
        drop-shadow(0 2px 1px rgba(28, 12, 3, 0.82))
        drop-shadow(0 7px 6px rgba(28, 12, 3, 0.5))
        drop-shadow(0 18px 16px rgba(28, 12, 3, 0.28));
    }
    .dub-note-card[data-note-variant="1"] { transform: translateY(2px) rotate(-0.65deg); }
    .dub-note-card[data-note-variant="2"] { transform: translateY(-1px) rotate(0.55deg); }
    .dub-note-card[data-note-variant="3"] { transform: translateY(1px) rotate(0.45deg); }
    .dub-note-card[data-note-variant="4"] { transform: translateY(-2px) rotate(-0.5deg); }
    .dub-note-content {
      position: absolute;
      left: 15%;
      top: 27%;
      width: 70%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;

    .dub-note-card[data-note-variant="1"] .dub-note-content { left: 23%; top: 27%; width: 66%; }
    .dub-note-card[data-note-variant="2"] .dub-note-content { left: 8%; top: 29%; width: 57%; }
    .dub-note-card[data-note-variant="3"] .dub-note-content { left: 16%; top: 30%; width: 70%; }
    .dub-note-card[data-note-variant="4"] .dub-note-content { left: 13%; top: 31%; width: 70%; }
    .dub-note-title {

      color: #352416;
      text-align: center;
      letter-spacing: -0.35px;
      line-height: 1.08;
      opacity: 0.9;
      mix-blend-mode: multiply;
      text-shadow: 0.35px 0.35px 0 rgba(74, 43, 22, 0.35);
      transform: rotate(-0.35deg);
    }
    .dub-note-chars { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
    .dub-char-pill {
      padding: 6px 14px;
      border-radius: 999px;
      border: 0;
      background: var(--pill-color, #78dce8);

      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.12s ease;
    }
    .dub-char-pill:hover { transform: translateY(-2px); }

    .dub-panel--studio {

      height: auto;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }
    .dub-studio-status { margin-bottom: 8px; }
    .dub-studio-caption {

      font-style: italic;
      font-size: 14px;
      color: #d8cfeb;
    }
    .dub-studio-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 2528 / 1686;
      background-image: url("/assets/dub/ui/studio-bg.jpg");
      background-size: 100% 100%;
      background-position: center;
      border-radius: 8px;
      overflow: hidden;
    }
    .dub-studio-video {
      position: absolute;
      left: 11.91%;
      top: 7.65%;
      width: 69.1%;
      height: 65.01%;
      object-fit: cover;
      background: #000;
    }
    .dub-console-btn {
      position: absolute;
      top: 92.82%;
      border: 0;
      background: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .dub-console-btn svg { width: 55%; height: 55%; fill: #fff8ec; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.7)); }
    .dub-console-btn--continue svg {
      transform: rotate(-15deg);
    }
    .dub-console-btn:hover:not(:disabled) { transform: scale(1.08); }
    .dub-console-btn:active:not(:disabled) { transform: scale(0.92); }
    .dub-console-btn:disabled { cursor: default; filter: grayscale(0.75) brightness(0.55); }
    .dub-console-btn--replay { left: 58.32%; top: 91.95%; width: 9.89%; height: 5.34%; }
    .dub-console-btn--record { left: 70.1%; top: 91.97%; width: 8.7%; height: 5.34%; }
    .dub-console-btn--record.recording svg { fill: #ffb3b3; }
    .dub-console-btn--record.recording { animation: dub-console-pulse 1s ease-in-out infinite; }
    .dub-console-btn--continue { left: 80.648%; top: 92.30%; width: 3.76%; height: 4.75%; }

    @keyframes dub-console-pulse {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 90, 90, 0)); }
      50% { filter: drop-shadow(0 0 10px rgba(255, 90, 90, 0.85)); }
    }
    .dub-console-btn--back {
      left: 8.61%;
      top: 91.67%;
      width: 10.56%;
      height: 5%;
      color: #17280f;
      font: 900 13px "Arial Black", Arial, sans-serif;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .dub-studio-tag {

      letter-spacing: 0.3px;

    .dub-studio-feedback {
      position: absolute;
      left: 11.91%;
      width: 69.1%;
      bottom: 28.5%;

      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 4px;
      text-align: center;
      z-index: 3;
      pointer-events: none;
    }
    .dub-studio-feedback .dub-word { font-size: 15px; font-weight: 700; }
    .dub-studio-feedback .dub-turn-indicator { margin: 4px 0 0; font-size: 11px; color: #d8cfeb; }

    .dub-turn-indicator { text-align: center; font-size: 16px; margin: 14px 0; color: #fff; }
    .dub-word { margin-right: 5px; }
    .dub-word.correct { color: #8ee89b; }
    .dub-word.wrong { color: #ff8e8e; }
    .dub-summary-line { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #3a2f52; overflow: auto; }
    .dub-summary-line strong { color: #78dce8; }
    .dialogue-status.dub-status-error { color: #ff8e8e; }

    .progress-dashboard {
      box-sizing: border-box;
      width: 1120px;
      height: 660px;
      padding: 18px 26px 24px;
      border: 5px solid #d8c98f;
      outline: 3px solid #302d38;
      background: #10182d;
      color: #26231f;
      font-family: "Courier New", monospace;

    }
    .progress-header { display: flex; align-items: center; justify-content: space-between; height: 54px; color: #e4d69d; }
    .progress-header strong { display: block; font: 900 30px "Courier New", monospace; letter-spacing: 3px; }
    .progress-header span { font-size: 11px; letter-spacing: 3px; }
    .paper-close { border: 2px solid #d8c98f; background: #151d33; color: #e4d69d; padding: 8px 12px; font: 700 12px "Courier New", monospace; cursor: pointer; }
    .paper-tabs { display: flex; gap: 8px; margin: 4px 0 -2px 30px; position: relative; z-index: 2; }
    .paper-tabs button { border: 2px solid #554f43; border-bottom: 0; background: #aa9b70; color: #29261f; padding: 8px 18px; font: 900 12px "Courier New", monospace; cursor: pointer; }
    .paper-tabs button.active { background: #e0d39f; transform: translateY(2px); }
    .paper-book { position: relative; display: grid; grid-template-columns: 1fr 28px 1fr; height: 526px; filter: drop-shadow(0 14px 12px rgba(0,0,0,.38)); }
    .paper-page { box-sizing: border-box; min-width: 0; padding: 28px 34px; background-color: #ded09a; background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(73,65,49,.09) 28px); border: 3px solid #6c624c; overflow: hidden; }
    .paper-page.left { border-radius: 12px 2px 2px 12px; box-shadow: inset -12px 0 18px rgba(74,62,39,.16); }
    .paper-page.right { border-radius: 2px 12px 12px 2px; box-shadow: inset 12px 0 18px rgba(74,62,39,.16); }

    .level-ribbon { width: max-content; margin: 10px auto 20px; padding: 6px 14px; background: #253551; color: #e0d39f; font-weight: 900; }

    .paper-stat-grid span { font-size: 12px; font-weight: 800; }
    .paper-stat-grid strong { color: #873e3e; }
    .success-score { display: flex; align-items: baseline; justify-content: center; gap: 12px; margin-bottom: 12px; }
    .success-score strong { color: #456645; font-size: 38px; }
    .success-score span { font-weight: 900; }
    .week-chart { height: 125px; display: flex; align-items: end; justify-content: space-around; border-left: 2px solid #756a50; border-bottom: 2px solid #756a50; padding: 0 8px; }
    .week-column { width: 46px; text-align: center; }
    .week-bars { height: 94px; display: flex; align-items: end; justify-content: center; gap: 3px; }
    .week-bars i { display: block; width: 13px; min-height: 2px; border: 1px solid #4d493e; }
    .week-bars .correct { background: #66845e; }
    .week-bars .incorrect { background: #a85454; }
    .week-column small { font-size: 9px; }
    .location-list { list-style: none; margin: 22px 0 0; padding: 0; border-top: 2px solid #756a50; }
    .location-list li { display: flex; justify-content: space-between; padding: 9px 4px; border-bottom: 1px dashed #887c5e; text-transform: uppercase; }
    .muted { color: #766d58; }
    .grammar-grid { display: grid; gap: 10px; }
    .grammar-card { position: relative; display: grid; gap: 6px; padding: 10px; border: 2px solid #756a50; overflow: hidden; }
    .grammar-card b, .grammar-card span { position: relative; z-index: 1; }
    .grammar-card span { font-size: 12px; }
    .grammar-card i { position: absolute; left: 0; bottom: 0; height: 5px; background: #66845e; }

    .menu-root {

      width: 1080px;

      display: flex;
      align-items: stretch;
      width: 100%;
      height: 380px;
      overflow: hidden;

    .menu-card {

      flex: 0 0 108px;
      margin-right: -18px;

      transform: translateY(-16px) rotate(-2deg);

    .menu-card.expanded {

      justify-content: center;
      padding: 16px 0;

      transition: opacity 0.2s ease;
    }
    .menu-card.expanded .menu-card-spine { opacity: 0; pointer-events: none; }

      letter-spacing: 3px;
      white-space: nowrap;

    .menu-card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: stretch;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease 0.1s;
    }

    .menu-card-art {
